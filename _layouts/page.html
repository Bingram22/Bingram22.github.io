---
layout: default
---

<section>
  <div class="page-content">
    {{ content }}
  </div>
</section>

<button id="theme-toggle" aria-label="Toggle dark mode" style="position:fixed;top:16px;right:16px;z-index:9999;background:none;border:1px solid currentColor;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;">🌙</button>

<style>
  html.dark-mode {
    filter: invert(1) hue-rotate(180deg);
  }
  html.dark-mode img,
  html.dark-mode picture,
  html.dark-mode video {
    filter: invert(1) hue-rotate(180deg); /* cancels the invert so photos look normal */
  }
</style>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  if (localStorage.getItem('theme') === 'dark') {
    root.classList.add('dark-mode');
    btn.textContent = '☀️';
  }
  btn.addEventListener('click', function () {
    root.classList.toggle('dark-mode');
    var isDark = root.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    btn.textContent = isDark ? '☀️' : '🌙';
  });
})();
</script>
